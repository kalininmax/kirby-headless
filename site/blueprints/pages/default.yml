title: Default Page

buttons:
  open: true
  settings: true
  languages: true
  status: true

options:
  move: false
  preview: '{{ page.frontendUrl }}'

tabs:
  content:
    icon: text
    columns:
      main:
        width: 3/4
        sections:
          fields:
            type: fields
            fields:
              text:
                type: textarea
                size: huge
      sidebar:
        width: 1/1
        sections:
          pages:
            type: pages
            template: default
          files:
            type: files

  seo: tabs/seo
